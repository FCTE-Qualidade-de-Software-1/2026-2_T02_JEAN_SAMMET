
name: Docs CD - Deploy MkDocs

on:
  push:
    branches:
      - main
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, milestoned, demilestoned]
  issue_comment:
    types: [created]
  milestone:
    types: [opened, edited, closed, reopened]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  deploy:
    name: Testar, coletar métricas e publicar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m unittest discover -s testes -t . -p 'teste_*.py' -v

      - name: Coletar métricas do projeto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m scripts.metricas --aplicar-rotulos

      - name: Publicar documentação
        run: mkdocs gh-deploy --force
