name: Validar Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: read

jobs:
  validate:
    name: Testes e documentação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m unittest discover -s testes -t . -p 'teste_*.py' -v

      - name: Gerar painel PSM (somente leitura)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m scripts.metricas

      - name: Compilar documentação
        run: python -m mkdocs build --strict --site-dir /tmp/mkdocs-pr
