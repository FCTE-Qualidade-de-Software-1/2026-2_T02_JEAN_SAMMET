repo_url: https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_JEAN_SAMMET
repo_name: Jean Sammet

site_url: https://fcte-qualidade-de-software-1.github.io/2026-2_T02_JEAN_SAMMET/
site_name: Jean Sammet
site_description: Documentação Grupo 5 Jean Sammet
site_author: Grupo 05

nav:
  - Início: index.md
  - Fases:
    - Fase 1:
        - Propósito e Stakeholders: fases/fase1/propositoEStakeholders.md
        - Software Escolhido: fases/fase1/softwareEscolhido.md
        - Modelo de Qualidade: fases/fase1/modeloDeQualidade.md
        - Características de Qualidade: fases/fase1/caracteristicasDeQualidade.md
        - Escopo: fases/fase1/escopo.md
        - ODS: fases/fase1/ODS.md
    - Fase 2:
        - Métricas Funcionais: fases/fase2/metricasFuncionais.md
        - Métricas Operacionais:
            - Sumário: fases/fase2/metricasOperacionais.md
            - Visão Geral (GQM): fases/fase2/operacionais/visaoGeral.md
            - Usabilidade: fases/fase2/operacionais/usabilidade.md
            - Segurança: fases/fase2/operacionais/seguranca.md
            - Protocolo de Coleta e Teste: fases/fase2/operacionais/protocolo.md

  - Gestão do Projeto:
    - Visão Geral: gestaoProjeto/psm-cid.md
    - Calendário e Progresso: gestaoProjeto/calendario-progresso.md
    - Recursos e Custos: gestaoProjeto/recursos-custos.md
    - Desempenho do Processo: gestaoProjeto/desempenho-processo.md
    - Acompanhamento: gestaoProjeto/acompanhamento.md
  - Critérios:
    - Premissas Iniciais: criterios/premissasIniciais.md
    - Fase 1: criterios/fase1.md
    - Fase 2: criterios/fase2.md
  - Equipe: equipe/equipe.md
  - Uso de IA:
    - Fase 1: usoDeIA/fase1.md
    - Fase 2: usoDeIA/fase2.md
    - PSM: usoDeIA/psm.md
  - Referências:
    - Fase 1: referencias/fase1.md
    - Fase 2: referencias/fase2.md
    - Organização: referencias/psm.md


theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Modo Noturno
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Modo Claro


markdown_extensions:
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
  - attr_list