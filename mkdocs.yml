repo_url: https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_JEAN_SAMMET
repo_name: Jean Sammet

site_url: https://fcte-qualidade-de-software-1.github.io/2026-2_T02_JEAN_SAMMET/
site_name: Jean Sammet
site_description: Documentação Grupo 5 Jean Sammet
site_author: Grupo 05

nav:
  - Início: index.md
  - Fase 1:
    - Propósito e Stakeholders: fase1/propositoEStakeholders.md
    - Software Escolhido: fase1/softwareEscolhido.md
    - Modelo de Qualidade: fase1/modeloDeQualidade.md
    - Características de Qualidade: fase1/caracteristicasDeQualidade.md
    - Escopo: fase1/escopo.md
    - ODS: fase1/ODS.md
    - Uso de IA: fase1/usoDeIA.md
    - Referências: fase1/referencias.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Modo Noturno
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Modo Claro


markdown_extensions:
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
  - attr_list