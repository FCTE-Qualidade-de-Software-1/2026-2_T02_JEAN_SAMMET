repo_url: https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_JEAN_SAMMET
repo_name: Jean Sammet

site_url: https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T02_JEAN_SAMMET/
site_name: Jean Sammet
site_description: Documentação Grupo 5 Jean Sammet
site_author: Grupo 05

nav:
  - Home: index.md

theme:
  name: material
  logo: 00_assets/imagens/logo_1.png
  favicon: 00_assets/imagens/logo_2.png
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Modo Noturno
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Modo Claro


markdown_extensions:
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
  - attr_list